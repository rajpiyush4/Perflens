services:
  postgres:
    image: postgres:17-alpine
    container_name: perflens-db
    restart: always
    environment:
      POSTGRES_USER: perflens_user
      POSTGRES_PASSWORD: perflens_password
      POSTGRES_DB: perflens_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: perflens-queue
    restart: always
    ports:
      - "6379:6379"

volumes:
  postgres_data:
